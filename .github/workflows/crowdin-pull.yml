name: Crowdin pull

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Apply the latest build even if it's older than the last translation commit
        type: boolean
        default: false

concurrency:
  group: crowdin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none

      - name: Download the latest build
        id: pull
        run: bash scripts/crowdin-pull.sh
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_FORCE: ${{ inputs.force }}

      - uses: pnpm/action-setup@v6
        if: steps.pull.outputs.downloaded == 'true'

      - uses: actions/setup-node@v7
        if: steps.pull.outputs.downloaded == 'true'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.pull.outputs.downloaded == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.pull.outputs.downloaded == 'true'
        run: pnpm exec biome format --write src/i18n/translations

      - if: steps.pull.outputs.downloaded == 'true'
        run: pnpm run translations:check

      - name: Commit changes
        if: steps.pull.outputs.downloaded == 'true'
        run: |
          if [[ -z "$(git status --porcelain -- src/i18n/translations)" ]]; then
            echo "No translation changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/translations
          git commit -m "update translations from Crowdin"
          git pull --rebase origin master
          git push origin HEAD:master
